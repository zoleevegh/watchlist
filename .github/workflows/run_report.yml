name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      report_number:
        description: "Which report to run (1/2/3)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      master_csv_url:
        description: "MASTER CSV URL (optional). Leave empty to use default."
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      # Used by the run-summary link builder (stable + readable even without token)
      GIST_OWNER: ${{ github.repository_owner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set report variables (1/2/3)
        shell: bash
        run: |
          set -euo pipefail

          REPORT="${{ github.event.inputs.report_number }}"
          if [ -z "${REPORT}" ]; then REPORT="1"; fi

          case "${REPORT}" in
            1)
              OUT_MD="reports/summary_report_1.md"
              GIST_ID="5df443b8a46ef863cdc97aad62756510"
              ;;
            2)
              OUT_MD="reports/summary_report_2.md"
              GIST_ID="31b8daf60f983fbdfe37e3d0f2251fc7"
              ;;
            3)
              OUT_MD="reports/summary_report_3.md"
              GIST_ID="8f77c3b0ec040030d492859095686030"
              ;;
            *)
              echo "Invalid report_number: ${REPORT}" >&2
              exit 1
              ;;
          esac

          echo "REPORT=${REPORT}" | tee -a "$GITHUB_ENV"
          echo "OUT_MD=${OUT_MD}" | tee -a "$GITHUB_ENV"
          echo "GIST_ID=${GIST_ID}" | tee -a "$GITHUB_ENV"
          echo "GIST_OWNER=${GITHUB_REPOSITORY_OWNER}" | tee -a "$GITHUB_ENV"

          echo "DEBUG: REPORT=${REPORT} OUT_MD=${OUT_MD} GIST_ID=${GIST_ID}"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # Safe defaults. If you have a requirements.txt, it will be used too.
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install requests

      - name: Run PRICE ENGINE (generate reports)
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p reports

          # MASTER URL (workflow input overrides default)
          MASTER_URL_INPUT="${{ github.event.inputs.master_csv_url }}"
          if [ -n "${MASTER_URL_INPUT}" ]; then
            MASTER_URL="${MASTER_URL_INPUT}"
          else
            MASTER_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"
          fi

          echo "MASTER_URL=${MASTER_URL}"
          curl -fsSL "${MASTER_URL}" -o reports/master.csv
          echo "MASTER downloaded: reports/master.csv"

          # Run the report runner (expects scripts/report_runner2.py)
          python scripts/report_runner2.py --report "${REPORT}" --master "reports/master.csv" --out "${OUT_MD}"

          # Quick sanity check: ensure main output exists
          test -f "${OUT_MD}"
          echo "OK: wrote ${OUT_MD}" 

      - name: Validate report (soft)
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "${OUT_MD}" ]; then
            echo "ERROR: ${OUT_MD} missing." >&2
            exit 1
          fi

          # Soft check: warn if we cannot find typical table header.
          if ! grep -Eq "^\|Ticker\b" "${OUT_MD}"; then
            echo "WARNING: nem találtam ticker sort a riportban (formátumváltozás vagy üres ticker-blokk)."
          fi

      - name: Update Gist (write correct file, prune others)
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GIST_TOKEN:-}" ]; then
            echo "No GIST_TOKEN secret - skip Gist update."
            exit 0
          fi

          if [ ! -f "${OUT_MD}" ]; then
            echo "${OUT_MD} not found - skip Gist update."
            exit 0
          fi

          FN="$(basename "${OUT_MD}")"
          CONTENT="$(python - <<'PY'
from pathlib import Path
import os
p = Path(os.environ['OUT_MD'])
print(p.read_text(encoding='utf-8', errors='replace'))
PY
)"

          # Build payload that ensures ONLY the selected file exists in this gist.
          # Existing files will be set to null (deleted).
          python - <<'PY'
import json, os
import urllib.request

gist_id = os.environ['GIST_ID']
fn = os.path.basename(os.environ['OUT_MD'])
content = open(os.environ['OUT_MD'], 'r', encoding='utf-8', errors='replace').read()

def gh_api(url, token):
    req = urllib.request.Request(url)
    req.add_header('Authorization', f'token {token}')
    req.add_header('Accept', 'application/vnd.github+json')
    with urllib.request.urlopen(req) as resp:
        return json.loads(resp.read().decode('utf-8'))

token = os.environ['GIST_TOKEN']
meta = gh_api(f'https://api.github.com/gists/{gist_id}', token)
files = {}
for existing in meta.get('files', {}).keys():
    if existing != fn:
        files[existing] = None
files[fn] = {'content': content}

payload = {'files': files}
open('reports/gist_payload.json','w',encoding='utf-8').write(json.dumps(payload))
PY

          curl -fsSL -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: token ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -d @reports/gist_payload.json

          echo "Gist updated." 

      - name: Write run summary (stable raw link)
        shell: bash
        run: |
          set -euo pipefail

          FN="$(basename "${OUT_MD}")"

          # Default "stable" raw URL format (works without token if file exists)
          BASE_URL="https://gist.githubusercontent.com/${GIST_OWNER}/${GIST_ID}/raw/${FN}"

          # If token is available, attempt to fetch the latest 'raw_url' with the hash.
          HASH_RAW_URL=""
          if [ -n "${GIST_TOKEN:-}" ]; then
            RAW_JSON="$(curl -fsSL \
              -H "Authorization: token ${GIST_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/gists/${GIST_ID}")" || true

            HASH_RAW_URL="$(python - <<'PY'
import json, os, sys
raw = os.environ.get('RAW_JSON','')
if not raw:
    sys.exit(0)
obj = json.loads(raw)
fn = os.environ['FN']
files = obj.get('files', {})
if fn in files and 'raw_url' in files[fn]:
    print(files[fn]['raw_url'])
PY
)"
          fi

          # Prefer hashed raw url when available
          RUN_SUMMARY_URL="${HASH_RAW_URL:-${BASE_URL}}"

          # Add nocache to help browser refresh
          RUN_SUMMARY_URL="${RUN_SUMMARY_URL}?nocache=${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"

          {
            echo "Job summary generated at run-time (${{ github.run_id }})"
            echo
            echo "Raw URL for this run:"
            echo "${RUN_SUMMARY_URL}"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "RUN_SUMMARY_URL=${RUN_SUMMARY_URL}"

      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: reports/

# Ensure the script uses the GIST_OWNER variable with a default value if not set
