name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      master:
        description: "MASTER CSV URL (optional; defaults to built-in MASTER)"
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      DEFAULT_MASTER_CSV: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"
      GIST_ID: 5df443b8a46ef863cdc97aad62756510
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pandas python-dateutil pytz
          fi

      - name: Run PRICE ENGINE (#1)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

          MASTER_URL="${{ github.event.inputs.master }}"
          if [ -z "${MASTER_URL}" ]; then
            MASTER_URL="${DEFAULT_MASTER_CSV}"
          fi

          echo "MASTER_URL=${MASTER_URL}"
          python report_runner.py --report 1 --master "${MASTER_URL}" --out reports/summary_report_1.md

      - name: Update fixed Gist with #1 report
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -z "${GIST_TOKEN}" ]; then
            echo "No GIST_TOKEN secret - skip Gist update (#1)."
            exit 0
          fi

          if [ ! -f reports/summary_report_1.md ]; then
            echo "reports/summary_report_1.md not found - skip Gist update (#1)."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          content = Path('reports/summary_report_1.md').read_text(encoding='utf-8', errors='replace')
          payload = {"files": {"summary_report_1.md": {"content": content}}}
          Path('reports/gist_payload.json').write_text(json.dumps(payload), encoding='utf-8')
          PY

          curl -sS -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @reports/gist_payload.json \
            > /dev/null

          echo "Gist updated."

      - name: Job summary (single nocache raw URL)
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          BASE="https://gist.githubusercontent.com/zoleevegh/${GIST_ID}/raw/summary_report_1.md"
          NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-$(date +%s)"
          URL="${BASE}?nocache=${NONCE}"

          echo "Raw report URL (nocache): <${URL}>" >> "${GITHUB_STEP_SUMMARY}"

          mkdir -p reports
          echo "${URL}" > reports/raw_url.txt

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/raw_url.txt
