# Version: v4.2.0-price-engine-single-cachebusted-url-2026-01-06
# Last updated: 2026-01-06T00:25:00+01:00
#
# FIXEK (v4.2.0):
# - A Job Summary-ban csak 1 link legyen: a stable raw URL VÉGÉRE automatikusan rárakunk egy random "krix-kraxot".
#   Példa: .../summary_report_1.md?<guid>
# - NINCS "fresh" külön sorban, nincs "mit csináljak ezzel" helyzet.
# - A Gist frissítés GitHub API-val (Invoke-RestMethod).
#
# Verzió-szabály: bármely fájl módosításakor a verziószámot folytatólagosan kell növelni, kihagyás nélkül.

name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      PRICE_ENGINE_REPORT:
        description: "PRICE ENGINE csak #1 (AH+PM)."
        required: true
        default: "1"

jobs:
  run:
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"
      GIST_ID_1: 5df443b8a46ef863cdc97aad62756510
      DEFAULT_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (if requirements.txt)
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          } else {
            Write-Host "No requirements.txt, skipping pip install."
          }

      - name: Fetch MASTER CSV
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $url = "${env:MASTER_CSV_URL}"
          if ([string]::IsNullOrWhiteSpace($url)) { $url = "${env:DEFAULT_CSV_URL}" }
          Write-Host "MASTER CSV URL: $url"
          curl.exe -L --fail "$url" -o "reports\master.csv"
          Write-Host "MASTER CSV lines:" (Get-Content "reports\master.csv" | Measure-Object -Line).Lines

      - name: Run PRICE ENGINE (#1) — capture runner.log
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          cmd.exe /c "python -X faulthandler -u scripts\report_runner.py --report 1 --master reports\master.csv --out reports\summary_report_1.md > reports\runner.log 2>&1"
          $code = [int]$LASTEXITCODE

          Write-Host "Runner exit code: $code"
          Write-Host "---- runner.log (last 200 lines) ----"
          if (Test-Path "reports\runner.log") { Get-Content -Path "reports\runner.log" -Tail 200 } else { Write-Host "runner.log missing" }
          Write-Host "-------------------------------------"

          if ($code -ne 0) {
            throw "Runner failed with exit code $code"
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/runner.log
            reports/master.csv

      - name: Update Gist (#1)
        shell: pwsh
        env:
          GH_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if (-not (Test-Path "reports\summary_report_1.md")) {
            throw "Missing reports\summary_report_1.md – cannot update gist."
          }

          $content = Get-Content -Path "reports\summary_report_1.md" -Raw
          $body = @{
            files = @{
              "summary_report_1.md" = @{
                content = $content
              }
            }
          } | ConvertTo-Json -Depth 6

          $headers = @{
            "Authorization" = "token $env:GH_GIST_TOKEN"
            "User-Agent"    = "watchlist-price-engine"
            "Accept"        = "application/vnd.github+json"
          }

          $url = "https://api.github.com/gists/${env:GIST_ID_1}"
          Invoke-RestMethod -Method PATCH -Uri $url -Headers $headers -Body $body | Out-Null
          Write-Host "Gist updated."

      - name: Job summary (single cache-busted raw link)
        if: always()
        shell: pwsh
        run: |
          $rawStable = "https://gist.githubusercontent.com/zoleevegh/${env:GIST_ID_1}/raw/summary_report_1.md"
          $krix = [guid]::NewGuid().ToString("N")
          $raw = "$rawStable?$krix"

          "Job summary generated at run-time ($(Get-Date -Format 'yyyy-MM-ddTHH:mmzzz'))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "Raw URL: $raw" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
