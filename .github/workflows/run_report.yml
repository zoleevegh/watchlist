name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      report_number:
        description: "Which report to run (1/2/3)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      master_csv_url:
        description: "MASTER CSV URL (optional). Leave empty to use default."
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set report variables (1/2/3)
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${{ inputs.report_number }}"
          if [ -z "${REPORT}" ]; then REPORT="1"; fi
          case "${REPORT}" in
            1) OUT_MD="reports/summary_report_1.md"; GIST_ID="5df443b8a46ef863cdc97aad62756510" ;;
            2) OUT_MD="reports/summary_report_2.md"; GIST_ID="31b8daf60f983fbdfe37e3d0f2251fc7" ;;
            3) OUT_MD="reports/summary_report_3.md"; GIST_ID="8f77c3b0ec040030d492859095686030" ;;
            *) echo "Invalid report_number: ${REPORT}"; exit 1 ;;
          esac
          echo "REPORT=${REPORT}" >> $GITHUB_ENV
          echo "OUT_MD=${OUT_MD}" >> $GITHUB_ENV
          echo "GIST_ID=${GIST_ID}" >> $GITHUB_ENV
          echo "DEBUG: REPORT=${REPORT} OUT_MD=${OUT_MD} GIST_ID=${GIST_ID}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: bash
        run: |
          export REPORT="${REPORT}"
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run PRICE ENGINE (#1) + build stable nocache link
        shell: bash
        env:
          # Default MASTER CSV (latest)
          DEFAULT_MASTER_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"
        run: |
          set -euo pipefail
          mkdir -p reports

          # Resolve MASTER URL (input overrides default)
          MASTER_URL="${{ github.event.inputs.master_csv_url }}"
          if [ -z "${MASTER_URL}" ]; then
            MASTER_URL="${DEFAULT_MASTER_CSV_URL}"
          fi
          echo "MASTER_URL=${MASTER_URL}" | tee reports/runner.log

          # Download MASTER to a local file (safer + artifact-friendly)
          if ! curl -fsSL "${MASTER_URL}" -o reports/master.csv ; then
            echo "WARN: MASTER download failed - runner will try reading URL directly." | tee -a reports/runner.log
          else
            echo "MASTER downloaded: reports/master.csv" | tee -a reports/runner.log
          fi


          # Pick runner path (based on REPORT)
          if [ "${REPORT}" = "1" ]; then
            if [ -f "report_runner.py" ]; then
              RUNNER="report_runner.py"
            elif [ -f "scripts/report_runner.py" ]; then
              RUNNER="scripts/report_runner.py"
            else
              echo "Runner script not found for report #1 (report_runner.py / scripts/report_runner.py)." | tee -a reports/runner.log
              exit 1
            fi
          elif [ "${REPORT}" = "2" ]; then
            if [ -f "report_runner2.py" ]; then
              RUNNER="report_runner2.py"
            elif [ -f "scripts/report_runner2.py" ]; then
              RUNNER="scripts/report_runner2.py"
            else
              echo "Runner script not found for report #2 (report_runner2.py / scripts/report_runner2.py)." | tee -a reports/runner.log
              exit 1
            fi
          else
            if [ -f "report_runner3.py" ]; then
              RUNNER="report_runner3.py"
            elif [ -f "scripts/report_runner3.py" ]; then
              RUNNER="scripts/report_runner3.py"
            else
              echo "Runner script not found for report #3 (report_runner3.py / scripts/report_runner3.py)." | tee -a reports/runner.log
              exit 1
            fi
          fi

          # Pick earnings script path (optional)
          if [ -f "scripts/earnings.py" ]; then
            EARNINGS="scripts/earnings.py"
          elif [ -f "earnings.py" ]; then
            EARNINGS="earnings.py"
          else
            EARNINGS=""
          fi

          # Run earnings next-7d audit (soft) -> reports/earnings_next7d.md
          RC_E=0
          set +e
          if [ -n "${EARNINGS}" ]; then
            if [ -f "reports/master.csv" ]; then
              python "${EARNINGS}" --master "reports/master.csv" --out "reports/earnings_next7d.md"
              RC_E=$?
            else
              python "${EARNINGS}" --master "${MASTER_URL}" --out "reports/earnings_next7d.md"
              RC_E=$?
            fi
          else
            RC_E=2
          fi
          set -e

          if [ "${RC_E}" -ne 0 ] || [ ! -f "reports/earnings_next7d.md" ]; then
            python -c "from pathlib import Path; Path('reports').mkdir(parents=True, exist_ok=True); Path('reports/earnings_next7d.md').write_text('# Earnings – következő 7 nap (MASTER szűrés)\n\nN/A: earnings.py nem található vagy nem futott le.\n', encoding='utf-8')"
            echo "EARNINGS_EXIT=${RC_E}" | tee -a reports/runner.log
          fi

          # Run runner (never hard-fail the job; we still want the stable raw link + gist update)
          RC=0
          set +e
          if [ -f "reports/master.csv" ]; then
            python "${RUNNER}" --master "reports/master.csv" --out "${OUT_MD}"
            RC=$?
          else
            python "${RUNNER}" --master "${MASTER_URL}" --out "${OUT_MD}"
            RC=$?
          fi
          set -e

          if [ "${RC}" -ne 0 ] || [ ! -f "${OUT_MD}" ]; then
            python -c "from pathlib import Path; Path('reports').mkdir(parents=True, exist_ok=True); Path(out_md).write_text('# #1 – Premarket check (PRICE ENGINE)\n\nNO_DATA: a report nem készült el (runner crash / hiányzó fájl / forráshiba).\n', encoding='utf-8')"
            echo "RUNNER_EXIT=${RC}" | tee -a reports/runner.log
          fi

          # Inject earnings block BEFORE '## Pozíciók' (csak #1, ha van earnings file)
          if [ "${REPORT}" = "1" ] && [ -f "reports/earnings_next7d.md" ] && [ -f "${OUT_MD}" ]; then
            awk 'FNR==NR{e=e $0 ORS; next} /## Pozíciók/ && !done{printf "%s\\n", e; done=1} {print}' reports/earnings_next7d.md "${OUT_MD}" > reports/_tmp_with_earnings.md
            mv reports/_tmp_with_earnings.md "${OUT_MD}"
          fi


          # Build one single clickable nocache URL (run id + attempt + sha)
          NOCACHE="${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          RAW_URL="https://gist.githubusercontent.com/${GITHUB_REPOSITORY_OWNER}/${GIST_ID}/raw/$(basename "${OUT_MD}")?nocache=${NOCACHE}"

          # Save raw url to artifact-friendly file too
          echo "${RAW_URL}" > "reports/raw_url_${REPORT}.txt"

          # Job summary (single link + copyable)
          {
            echo "Job summary generated at run-time (${{ github.run_id }})"
            echo ""
            echo "Raw URL for this run:"
            echo "${RAW_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate report (soft)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "validate_run.py" ]; then
            python validate_run.py --report "${REPORT}" --path "${OUT_MD}" || true
          elif [ -f "scripts/validate_run.py" ]; then
            python scripts/validate_run.py --report "${REPORT}" --path "${OUT_MD}" || true
          else
            echo "No validate_run.py found - skip."
          fi

      - name: Update Gist (summary_report_{1,2,3}.md)
        if: always()
        shell: bash
        env:
          GIST_ID: "${GIST_ID}"
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GIST_TOKEN:-}" ]; then
            echo "No GIST_TOKEN secret - skip Gist update."
            exit 0
          fi
          if [ ! -f "${OUT_MD}" ]; then
            echo "${OUT_MD} not found - skip Gist update."
            exit 0
          fi

          python - <<'PY'
          import json, os
          from pathlib import Path

          out_md = Path(os.environ["OUT_MD"])
          fn = f"summary_report_{os.environ.get('REPORT','1')}.md"
          content = out_md.read_text(encoding="utf-8", errors="replace")
          payload = {"files": {fn: {"content": content}}}
          Path("reports/gist_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl -sS -X PATCH "https://api.github.com/gists/${GIST_ID}"             -H "Authorization: token ${GIST_TOKEN}"             -H "Accept: application/vnd.github+json"             --data-binary "@reports/gist_payload.json" > /dev/null

          echo "Gist updated."

      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: reports/
