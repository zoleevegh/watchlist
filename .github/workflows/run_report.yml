# Version: v4.1.0-price-engine-debugstep-pwshfix-2026-01-05
# Last updated: 2026-01-05T13:05:00+01:00
#
# PRICE ENGINE workflow — debug a Yahoo failure quickly (Windows runner compatible).
# - No file input window (workflow_dispatch has only PRICE_ENGINE_REPORT).
# - Fetches MASTER CSV from env MASTER_CSV_URL if present, else DEFAULT_CSV_URL.
# - Debug step prints script heads and extracts VERSION via python -c (PowerShell safe).
#
# NOTE: Gist update step is repo-specific; keep/replace with your existing gist logic if needed.
#
# Verzió-szabály: bármely fájl módosításakor a verziószámot folytatólagosan kell növelni, kihagyás nélkül.

name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      PRICE_ENGINE_REPORT:
        description: "PRICE ENGINE csak #1 (AH+PM)."
        required: true
        default: "1"

jobs:
  run:
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"
      DEBUG: "1"
      GIST_ID_1: 5df443b8a46ef863cdc97aad62756510
      DEFAULT_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (if requirements.txt exists)
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          } else {
            Write-Host "No requirements.txt, skipping pip install."
          }

      - name: Fetch MASTER CSV
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $url = "${env:MASTER_CSV_URL}"
          if ([string]::IsNullOrWhiteSpace($url)) { $url = "${env:DEFAULT_CSV_URL}" }
          Write-Host "MASTER CSV URL: $url"
          $ok = $false
          for ($i=1; $i -le 4; $i++) {
            try {
              curl.exe -L --fail --retry 3 --retry-all-errors --retry-delay 1 "$url" -o "reports\master.csv"
              $ok = $true
              break
            } catch {
              Write-Warning "Fetch failed (try $i)."
              Start-Sleep -Seconds 1
            }
          }
          if (-not $ok) { throw "MASTER CSV letöltés sikertelen." }

      - name: DEBUG — show runner versions (PowerShell safe)
        shell: pwsh
        run: |
          python -V
          Write-Host "Listing scripts directory:"
          Get-ChildItem -Path scripts -Name
          Write-Host "First 30 lines of scripts/report_runner.py:"
          Get-Content -Path scripts/report_runner.py -TotalCount 30
          Write-Host "First 30 lines of scripts/validate_run.py:"
          Get-Content -Path scripts/validate_run.py -TotalCount 30
          Write-Host "Extract VERSION from report_runner.py:"
          python -c "import re; s=open('scripts/report_runner.py','r',encoding='utf-8').read(); m=re.search(r'^VERSION\s*=\s*[\"\']([^\"\']+)[\"\']', s, re.M); print(m.group(1) if m else 'NO_VERSION_FOUND')"

      - name: Run PRICE ENGINE (#1)
        shell: pwsh
        run: |
          python -X faulthandler -u scripts\report_runner.py --debug --report 1 --master reports\master.csv --out reports\summary_report_1.md

      - name: Validate report output
        shell: pwsh
        run: |
          python scripts\validate_run.py --report 1 --path reports\summary_report_1.md

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/master.csv

      - name: Run summary
        shell: pwsh
        run: |
          $raw = "https://gist.githubusercontent.com/zoleevegh/${env:GIST_ID_1}/raw/summary_report_1.md?run=${env:GITHUB_RUN_ID}"
          "Run report:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "$raw" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
