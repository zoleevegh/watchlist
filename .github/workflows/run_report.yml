# Ima (v1.0.16): bocsáss meg uram, ha megint mellényúltam;
# adj türelmet és tiszta logot, hogy csak az igazat írjam le.
# Verzió: v1.0.16-run_report-add-bs4-2026-02-19
# run_report.yml — v1.0.16-2026-02-19

name: Run Report — PRICE ENGINE

# run_report.yml — v1.0.0-2026-01-21

"on":
  workflow_dispatch:
    inputs:
      report_number:
        description: "Which report to run (1/2/3)"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
      master_csv_url:
        description: "MASTER CSV URL (optional). Leave empty to use default."
        required: false
        default: ""

      debug:
        description: "Debug (0/1) — MarketBeat HTML dump"
        required: false
        default: "0"
        type: choice
        options:
        - "0"
        - "1"
jobs:
  run:
    runs-on: ubuntu-latest
    env:
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set report variables (1/2/3)
        shell: bash
        run: |
          set -euo pipefail
          REPORT="${{ inputs.report_number }}"
          if [ -z "${REPORT}" ]; then REPORT="1"; fi
          case "${REPORT}" in
            1) OUT_MD="reports/summary_report_1.md"; GIST_ID="5df443b8a46ef863cdc97aad62756510" ;;
            2) OUT_MD="reports/summary_report_2.md"; GIST_ID="31b8daf60f983fbdfe37e3d0f2251fc7" ;;
            3) OUT_MD="reports/summary_report_3.md"; GIST_ID="8f77c3b0ec040030d492859095686030" ;;
            *) echo "Invalid report_number: ${REPORT}"; exit 1 ;;
          esac
          echo "REPORT=${REPORT}" >> $GITHUB_ENV
          echo "OUT_MD=${OUT_MD}" >> $GITHUB_ENV
          echo "GIST_ID=${GIST_ID}" >> $GITHUB_ENV
          DEBUG="${{ inputs.debug }}"
          if [ -z "${DEBUG}" ]; then DEBUG="0"; fi
          echo "DEBUG=${DEBUG}" >> $GITHUB_ENV
          echo "DEBUG: REPORT=${REPORT} OUT_MD=${OUT_MD} GIST_ID=${GIST_ID} DEBUG=${DEBUG}"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore/Save MarketBeat seen cache (first-seen dates)
        if: ${{ env.REPORT == '1' }}
        uses: actions/cache@v4
        with:
          path: |
            reports/marketbeat_seen.json
            reports/marketbeat_last_success.json
            reports/marketbeat_last_success.md
            reports/analyst_last2d.md
            reports/analyst_last2d.json
          # Always save a fresh cache each run (unique key), but restore the latest prior one via restore-keys.
          key: marketbeat-seen-v1-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            marketbeat-seen-v1-${{ runner.os }}-${{ github.ref_name }}-
            marketbeat-seen-v1-${{ runner.os }}-

      - name: Ensure MarketBeat seen state file exists
        if: ${{ env.REPORT == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ ! -f reports/marketbeat_seen.json ]; then
            echo '{}' > reports/marketbeat_seen.json
          fi


      - name: Install deps
        shell: bash
        run: |
          export REPORT="${REPORT}"
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Analyst feed (Briefing / HTML) parser dependency
          pip install beautifulsoup4 lxml

      - name: Run PRICE ENGINE (#1) + build stable nocache link
        shell: bash
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}

          # Default MASTER CSV (latest)
          DEFAULT_MASTER_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"
        run: |
          set -euo pipefail
          mkdir -p reports

          # Resolve MASTER URL (input overrides default)
          MASTER_URL="${{ github.event.inputs.master_csv_url }}"
          if [ -z "${MASTER_URL}" ]; then
            MASTER_URL="${DEFAULT_MASTER_CSV_URL}"
          fi
          echo "MASTER_URL=${MASTER_URL}" | tee reports/runner.log

          # Download MASTER to a local file (safer + artifact-friendly)
          if ! curl -fsSL "${MASTER_URL}" -o reports/master.csv ; then
            echo "WARN: MASTER download failed - runner will try reading URL directly." | tee -a reports/runner.log
          else
            echo "MASTER downloaded: reports/master.csv" | tee -a reports/runner.log
          fi


          # Pick runner path (based on REPORT)
          if [ "${REPORT}" = "1" ]; then
            if [ -f "report_runner.py" ]; then
              RUNNER="report_runner.py"
            elif [ -f "scripts/report_runner.py" ]; then
              RUNNER="scripts/report_runner.py"
            else
              echo "Runner script not found for report #1 (report_runner.py / scripts/report_runner.py)." | tee -a reports/runner.log
              exit 1
            fi
          elif [ "${REPORT}" = "2" ]; then
            if [ -f "report_runner2.py" ]; then
              RUNNER="report_runner2.py"
            elif [ -f "scripts/report_runner2.py" ]; then
              RUNNER="scripts/report_runner2.py"
            else
              echo "Runner script not found for report #2 (report_runner2.py / scripts/report_runner2.py)." | tee -a reports/runner.log
              exit 1
            fi
          else
            if [ -f "report_runner3.py" ]; then
              RUNNER="report_runner3.py"
            elif [ -f "scripts/report_runner3.py" ]; then
              RUNNER="scripts/report_runner3.py"
            else
              echo "Runner script not found for report #3 (report_runner3.py / scripts/report_runner3.py)." | tee -a reports/runner.log
              exit 1
            fi
          fi

          # Pick earnings script path (optional)
          if [ -f "scripts/earnings.py" ]; then
            EARNINGS="scripts/earnings.py"
          elif [ -f "earnings.py" ]; then
            EARNINGS="earnings.py"
          else
            EARNINGS=""
          fi

          # Pick analyst script path (optional)
          if [ -f "scripts/analyst_marketbeat.py" ]; then
            ANALYST="scripts/analyst_marketbeat.py"
          elif [ -f "analyst_marketbeat.py" ]; then
            ANALYST="analyst_marketbeat.py"
          else
            ANALYST=""
          fi

          # Run runner (never hard-fail the job; we still want the stable raw link + gist update)
          RC=0
          set +e
          if [ -f "reports/master.csv" ]; then
            python "${RUNNER}" --master "reports/master.csv" --out "${OUT_MD}"
            RC=$?
          else
            python "${RUNNER}" --master "${MASTER_URL}" --out "${OUT_MD}"
            RC=$?
          fi
          set -e

          if [ "${RC}" -ne 0 ] || [ ! -f "${OUT_MD}" ]; then
            python -c "from pathlib import Path; Path('reports').mkdir(parents=True, exist_ok=True); Path('${OUT_MD}').write_text('# #1 – Premarket check (PRICE ENGINE)\n\nNO_DATA: a report nem készült el (runner crash / hiányzó fájl / forráshiba).\n', encoding='utf-8')"
            echo "RUNNER_EXIT=${RC}" | tee -a reports/runner.log
          fi

          # Run analyst feed (soft) -> reports/analyst_last2d.md / reports/analyst_last2d.json
          RC_A=0
          set +e
          if [ "${REPORT}" = "1" ] && [ -n "${ANALYST}" ]; then
            EXTRA=""
            if [ "${DEBUG}" = "1" ]; then EXTRA="--debug"; fi
            if [ -f "reports/master.csv" ]; then
              python "${ANALYST}" --master "reports/master.csv" --days 2 --out-md "reports/analyst_last2d.md" --out-json "reports/analyst_last2d.json" ${EXTRA}
              RC_A=$?
            else
              python "${ANALYST}" --master "${MASTER_URL}" --days 2 --out-md "reports/analyst_last2d.md" --out-json "reports/analyst_last2d.json" ${EXTRA}
              RC_A=$?
            fi
          else
            RC_A=2
          fi
          set -e
          if [ "${REPORT}" = "1" ] && ( [ "${RC_A}" -ne 0 ] || [ ! -f "reports/analyst_last2d.md" ] ); then
            python -c "from pathlib import Path; Path('reports').mkdir(parents=True, exist_ok=True); Path('reports/analyst_last2d.md').write_text('# Elemzői feed (MarketBeat) – utolsó 2 naptári nap\n\n_N/A._\n', encoding='utf-8')"
            echo "ANALYST_EXIT=${RC_A}" | tee -a reports/runner.log
          fi

          # Run earnings next-7d audit (soft) -> reports/earnings_next7d.md
          RC_E=0
          set +e
          if [ -n "${EARNINGS}" ]; then
            if [ -f "reports/master.csv" ]; then
              python "${EARNINGS}" --master "reports/master.csv" --out "reports/earnings_next7d.md"
              RC_E=$?
            else
              python "${EARNINGS}" --master "${MASTER_URL}" --out "reports/earnings_next7d.md"
              RC_E=$?
            fi
          else
            RC_E=2
          fi
          set -e
          if [ "${RC_E}" -ne 0 ] || [ ! -f "reports/earnings_next7d.md" ]; then
            python -c "from pathlib import Path; Path('reports').mkdir(parents=True, exist_ok=True); Path('reports/earnings_next7d.md').write_text('# Earnings – következő 7 nap (MASTER szűrés)\n\nN/A: earnings.py nem található vagy nem futott le.\n', encoding='utf-8')"
            echo "EARNINGS_EXIT=${RC_E}" | tee -a reports/runner.log
          fi

          # Inject blocks into the final #1 markdown in order: Analyst -> Earnings
          cat > /tmp/inject_blocks.py <<'PY'
          import os, re
          from pathlib import Path
          
          out_md = Path(os.environ.get("OUT_MD", ""))
          analyst_md = Path("reports/analyst_last2d.md")
          earnings_md = Path("reports/earnings_next7d.md")
          
          def strip_leading_meta(text: str) -> str:
              lines = text.splitlines()
              while lines and (
                  lines[0].startswith("#")
                  or lines[0].startswith("Verzió:")
                  or lines[0].startswith("Generálva")
                  or lines[0].strip() == ""
              ):
                  lines.pop(0)
              return "\n".join(lines).strip()
          
          if not out_md or not out_md.exists():
              raise SystemExit(0)
          
          base = out_md.read_text(encoding="utf-8", errors="replace")
          
          # prune previous injected blocks (if any)
          base = re.split(r"\n## Elemzői feed \(MarketBeat\).*", base, maxsplit=1, flags=re.S)[0].rstrip() + "\n"
          base = re.split(r"\n## Earnings — következő 7 nap.*", base, maxsplit=1, flags=re.S)[0].rstrip() + "\n"
          
          a_raw = analyst_md.read_text(encoding="utf-8", errors="replace") if analyst_md.exists() else ""
          e_raw = earnings_md.read_text(encoding="utf-8", errors="replace") if earnings_md.exists() else ""
          
          a = strip_leading_meta(a_raw)
          e = strip_leading_meta(e_raw)
          
          # Avoid showing the old italic "no fresh" sentence; keep it clean.
          if "Nincs friss" in a and "fel/leminősítés" in a:
              a = ""
          
          if not a:
              a = "N/A"
          if not e:
              e = "N/A"
          
          injected = (
              "\n\n## Elemzői feed (MarketBeat) — fel/leminősítések + célár (utolsó 2 naptári nap)\n\n"
              + a
              + "\n\n## Earnings — következő 7 nap\n\n"
              + e
              + "\n"
          )
          
          out_md.write_text(base.rstrip() + injected, encoding="utf-8")
          PY
          if [ "${REPORT}" = "1" ] && [ -f "${OUT_MD}" ]; then
            python /tmp/inject_blocks.py
          fi


          # Build one single clickable nocache URL (run id + attempt + sha)
          NOCACHE="${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          echo "NOCACHE=${NOCACHE}" >> $GITHUB_ENV


          # (moved) Job summary link is written in the dedicated "Write run summary" step later.
          # This avoids duplicate links in the Actions UI.
          :
          :
          :
          :
          :

      - name: Validate report (soft)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "validate_run.py" ]; then
            python validate_run.py --report "${REPORT}" --path "${OUT_MD}" || true
          elif [ -f "scripts/validate_run.py" ]; then
            python scripts/validate_run.py --report "${REPORT}" --path "${OUT_MD}" || true
          else
            echo "No validate_run.py found - skip."
          fi

      - name: Update Gist (write correct file, prune others)
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GIST_TOKEN:-}" ]; then
            echo "No GIST_TOKEN secret - skip Gist update."
            exit 0
          fi
          if [ ! -f "${OUT_MD}" ]; then
            echo "${OUT_MD} not found - skip Gist update."
            exit 0
          fi
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          import urllib.request

          gist_id = os.environ["GIST_ID"]
          token = os.environ["GIST_TOKEN"]
          out_md = Path(os.environ["OUT_MD"])
          target_fn = out_md.name
          content = out_md.read_text(encoding="utf-8", errors="replace")

          api_url = f"https://api.github.com/gists/{gist_id}"

          def gh_get(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "watchlist-price-engine"
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          def gh_patch(url, payload):
              data = json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method="PATCH", headers={
                  "Authorization": f"token {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "watchlist-price-engine"
              })
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          gist = gh_get(api_url)
          files = gist.get("files", {})

          # Delete wrong summary_report_*.md files (keep only the target)
          deletions = {}
          for fn in files.keys():
              if fn.startswith("summary_report_") and fn.endswith(".md") and fn != target_fn:
                  deletions[fn] = None

          payload = {"files": {**deletions, target_fn: {"content": content}}}
          updated = gh_patch(api_url, payload)
          # Build revision-pinned raw URL so older run links stay stable
          owner = (updated.get("owner") or {}).get("login") or (gist.get("owner") or {}).get("login") or ""
          ver = None
          try:
              hist = updated.get("history") or []
              ver = hist[0].get("version") if hist else None
          except Exception:
              ver = None
          report = os.environ.get("REPORT", "") or "1"
          nocache = os.environ.get("NOCACHE", "")
          if owner and ver:
              raw = f"https://gist.githubusercontent.com/{owner}/{gist_id}/raw/{ver}/{target_fn}"
          elif owner:
              raw = f"https://gist.githubusercontent.com/{owner}/{gist_id}/raw/{target_fn}"
          else:
              raw = f"https://gist.githubusercontent.com/{gist_id}/raw/{target_fn}"
          if nocache:
              raw = raw + f"?nocache={nocache}"
          Path(f"reports/raw_url_{report}.txt").write_text(raw + "\n", encoding="utf-8")
          print("Gist updated:", raw)
          PY
      - name: Write run summary (stable raw link)
        if: always()
        shell: bash
        run: |
            set -euo pipefail
            # Determine owner (no secrets needed).
            GIST_OWNER="${GITHUB_REPOSITORY_OWNER:-}"
            if [ -z "${GIST_OWNER}" ]; then
              GIST_OWNER="${GITHUB_REPOSITORY%%/*}"
            fi
            : "${REPORT:=}"
            : "${OUT_MD:=}"
            : "${GIST_ID:=}"
            if [ -z "${GIST_OWNER}" ] || [ -z "${GIST_ID}" ] || [ -z "${OUT_MD}" ]; then
              echo "WARNING: missing vars for run summary (GIST_OWNER/GIST_ID/OUT_MD)."
              exit 0
            fi
            FN="$(basename "${OUT_MD}")"
            # Stable raw link (no hash) – works as long as the file exists in the gist.
            RUN_ID="${GITHUB_RUN_ID}"
            RUN_ATTEMPT="${GITHUB_RUN_ATTEMPT}"
            SHA="${GITHUB_SHA}"
            RUN_SUMMARY_URL="$(cat reports/raw_url_${REPORT}.txt 2>/dev/null || echo "")"
            if [ -z "${RUN_SUMMARY_URL}" ]; then
              RUN_SUMMARY_URL="https://gist.githubusercontent.com/${GIST_OWNER}/${GIST_ID}/raw/${FN}?nocache=${RUN_ID}-${RUN_ATTEMPT}-${SHA}"
            fi
            echo "RUN_SUMMARY_URL=${RUN_SUMMARY_URL}"
            {
              echo "Job summary generated at run-time (${RUN_ID})"
              echo ""
              echo "Raw URL for this run:"
              echo "${RUN_SUMMARY_URL}"
            } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: reports/
