# Version: v4.0.3-price-engine-2026-01-05
# Last updated: 2026-01-05T09:45:00+01:00
# Cél: PRICE ENGINE workflow — csak AH/PM % + küszöb + lefedettség. NINCS makró / analyst / catalyst / high-conv.
# FIX: Windows runneren ZoneInfo tzdata hiány miatt borulhat → itt pip tzdata, plusz a scriptben tz-safe fallback.

name: Run Report (Windows) — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      master_url:
        description: "MASTER CSV URL (Publish-to-web CSV). Ha üres, DEFAULT_CSV_URL / repo var MASTER_CSV_URL lesz használva."
        required: false
        default: ""
      report:
        description: "PRICE ENGINE csak #1 (AH+PM)."
        required: false
        default: "1"

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      DEFAULT_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ7N4XK79VsOKkQ2AQhpiaI9hp1KOcM2KZ_byPpbdpCSFVYvWEE32Vj0kNcd6DnSA/pub?output=csv"
      GIST_ID_1: 5df443b8a46ef863cdc97aad62756510

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (tzdata safety)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install tzdata

      - name: Resolve inputs (force report=1)
        id: vars
        shell: pwsh
        run: |
          $report = "1"
          "report=$report" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "REPORT (forced): $report"

      - name: Resolve MASTER URL (input > env > repo var)
        id: master
        shell: pwsh
        run: |
          $url = "${{ inputs.master_url }}"
          if ([string]::IsNullOrWhiteSpace($url)) { $url = "${{ env.DEFAULT_CSV_URL }}" }
          if ([string]::IsNullOrWhiteSpace($url)) { $url = "${{ vars.MASTER_CSV_URL }}" }

          if ([string]::IsNullOrWhiteSpace($url)) {
            Write-Error "Nincs MASTER URL. Add meg a workflow inputban (master_url), vagy töltsd ki DEFAULT_CSV_URL-t, vagy repo variable: MASTER_CSV_URL."
            exit 1
          }

          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "MASTER URL: $url"

      - name: Fetch MASTER CSV
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          $url = "${{ steps.master.outputs.url }}"
          $out = "reports\master.csv"

          Write-Host "MASTER CSV letöltés: $url"
          & curl.exe -fL --retry 3 --retry-all-errors -A "Mozilla/5.0" "$url" -o "$out"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MASTER CSV letöltés sikertelen (curl exit $LASTEXITCODE). URL: $url"
            exit 1
          }

          $first = Get-Content "$out" -TotalCount 1
          if ($first -match "<!DOCTYPE html>|<html") {
            Write-Error "Nem CSV érkezett (HTML). Valószínű nincs publish-to-web, vagy jogosultsági/átirányítási gond. URL: $url"
            exit 1
          }

          Get-Content "$out" -TotalCount 2 | ForEach-Object { Write-Host "CSV> $_" }

      - name: Run PRICE ENGINE (#1)
        shell: pwsh
        run: |
          python scripts\report_runner.py --report 1 --master reports\master.csv --out reports\summary_report_1.md

      - name: Validate report output
        shell: pwsh
        run: |
          python scripts\validate_run.py --report 1 --path reports\summary_report_1.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/master.csv

      - name: Update Gist (#1)
        shell: pwsh
        env:
          GIST_ID: ${{ env.GIST_ID_1 }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if (-not $env:GIST_TOKEN) {
            Write-Host "No GIST_TOKEN secret – skip Gist update."
            exit 0
          }

          $reportPath = "reports\summary_report_1.md"
          $content = Get-Content $reportPath -Raw -Encoding utf8

          $body = @{
            files = @{
              "summary_report_1.md" = @{
                content = $content
              }
            }
          }

          $json = $body | ConvertTo-Json -Depth 6
          $url  = "https://api.github.com/gists/$($env:GIST_ID)"

          $null = curl.exe -s -X PATCH $url `
            -H "Authorization: Bearer $($env:GIST_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            -d $json

          "Raw URL for this run:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "https://gist.githubusercontent.com/zoleevegh/$($env:GIST_ID)/raw/summary_report_1.md?run=${{ github.run_id }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
