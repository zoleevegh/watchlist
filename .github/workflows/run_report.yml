name: Run Report — PRICE ENGINE (#1)

on:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  DEFAULT_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0vpBd1ADF3_Godyflgh3-TbJoj_CCRBJ4QHeLiZCY12tHPWuTIL5OZBTByMApdT92vjS2pRpI1koM/pub?output=csv"
  GIST_ID_1: "5df443b8a46ef863cdc97aad62756510"

jobs:
  run-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || true

      - name: Fetch MASTER CSV
        run: |
          echo "📥 Downloading MASTER CSV..."
          curl -L "${{ env.MASTER_CSV_URL || env.DEFAULT_CSV_URL }}" -o master.csv
          echo "MASTER CSV size: $(wc -l < master.csv) lines"

      - name: Run PRICE ENGINE (#1)
        id: run_engine
        shell: pwsh
        run: |
          Write-Host "🏁 Starting PRICE ENGINE (#1) – v4.1.6-safe-update"
          python scripts/report_runner.py --report 1 --input master.csv --out reports/summary_report_1.md
          $code = $LASTEXITCODE
          Write-Host "Exit code from runner: $code"

          # --- ALL_NA védelem beépítve ---
          $shouldUpdate = 0
          if ($code -eq 0) { $shouldUpdate = 1 }
          "SHOULD_UPDATE_GIST=$shouldUpdate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RUNNER_EXIT_CODE=$code" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($code -eq 5) {
            Write-Host "⚠️  ALL_NA (exit 5) – Minden adat N/A, gist frissítés letiltva."
            exit 0
          }

          if ($code -ne 0) {
            Write-Host "❌ Runner hiba ($code), workflow megszakítva."
            exit $code
          }

          Write-Host "✅ PRICE ENGINE futás sikeres."

      - name: Update Gist (#1)
        if: env.SHOULD_UPDATE_GIST == '1'
        uses: andymckay/append-gist-action@v2
        with:
          gistURL: https://gist.github.com/zoleevegh/${{ env.GIST_ID_1 }}
          token: ${{ secrets.GIST_TOKEN }}
          filename: summary_report_1.md
          input_file: reports/summary_report_1.md
          action: replace
        continue-on-error: false

      - name: Job Summary
        shell: pwsh
        run: |
          $rawStable = "https://gist.githubusercontent.com/zoleevegh/${env:GIST_ID_1}/raw/summary_report_1.md"
          $rawFresh  = "$rawStable?run=${env:GITHUB_RUN_ID}"
          Write-Host "📝 Stable URL: $rawStable"
          Write-Host "🆕 Fresh URL:  $rawFresh"
          echo "### Run summary generated at run-time ($(Get-Date -Format 'yyyy-MM-ddTHH:mmzzz'))" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Raw URL (stable)**: [$rawStable]($rawStable)" >> $env:GITHUB_STEP_SUMMARY
          echo "**Raw URL (fresh)**: [$rawFresh]($rawFresh)" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "**Exit code:** $env:RUNNER_EXIT_CODE" >> $env:GITHUB_STEP_SUMMARY
          echo "**Should update Gist:** $env:SHOULD_UPDATE_GIST" >> $env:GITHUB_STEP_SUMMARY

      - name: Cleanup artifacts
        if: always()
        run: |
          echo "🧹 Cleaning temporary files..."
          rm -f master.csv || true
          rm -f reports/summary_report_1.md || true
