# Version: v4.0.8-price-engine-debug-runner-2026-01-05
# Last updated: 2026-01-05T11:30:00+01:00
# PRICE ENGINE workflow — fix MASTER CSV, nincs input ablak, vissza "run report" step summary.
# Verzió-szabály: bármely fájl módosításakor a verziószámot folytatólagosan kell növelni, kihagyás nélkül.

name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      DEBUG: "1"

      # MASTER CSV (Publish-to-web)
      DEFAULT_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv

      # Gist (#1) — summary_report_1.md
      GIST_ID_1: 5df443b8a46ef863cdc97aad62756510

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (tzdata safety)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install tzdata

      - name: Fetch MASTER CSV
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $url = "${{ env.DEFAULT_CSV_URL }}"
          $out = "reports\master.csv"

          Write-Host "MASTER CSV letöltés: $url"
          & curl.exe -fL --retry 3 --retry-all-errors -A "Mozilla/5.0" "$url" -o "$out"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MASTER CSV letöltés sikertelen (curl exit $LASTEXITCODE). URL: $url"
            exit 1
          }

          $first = Get-Content "$out" -TotalCount 1
          if ($first -match "<!DOCTYPE html>|<html") {
            Write-Error "Nem CSV érkezett (HTML). Ellenőrizd a Publish-to-web linket. URL: $url"
            exit 1
          }

      - name: DEBUG — show runner versions
        shell: pwsh
        run: |
          python -V
          Write-Host "Listing scripts directory:"
          Get-ChildItem -Path scripts -Name
          Write-Host "First 25 lines of scripts/report_runner.py:"
          Get-Content -Path scripts/report_runner.py -TotalCount 25
          Write-Host "First 25 lines of scripts/validate_run.py:"
          Get-Content -Path scripts/validate_run.py -TotalCount 25
          Write-Host "Import VERSION from report_runner.py (safe import):"
          python -c "import importlib.util; p='scripts/report_runner.py'; spec=importlib.util.spec_from_file_location('rr', p); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print(getattr(m,'VERSION','NO_VERSION'))"

      - name: Run PRICE ENGINE (#1)
        shell: pwsh
        run: |
          python -X faulthandler -u scripts\report_runner.py --debug --report 1 --master reports\master.csv --out reports\summary_report_1.md

      - name: Validate report output
        shell: pwsh
        run: |
          python scripts\validate_run.py --report 1 --path reports\summary_report_1.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/master.csv

      - name: Update Gist (#1)
        shell: pwsh
        env:
          GIST_ID: ${{ env.GIST_ID_1 }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if (-not $env:GIST_TOKEN) {
            Write-Host "No GIST_TOKEN secret – skip Gist update."
            exit 0
          }

          $reportPath = "reports\summary_report_1.md"
          if (-not (Test-Path $reportPath)) {
            Write-Error "Hiányzik a report: $reportPath"
            exit 1
          }

          $content = Get-Content $reportPath -Raw -Encoding utf8

          $body = @{
            files = @{
              "summary_report_1.md" = @{
                content = $content
              }
            }
          }

          $json = $body | ConvertTo-Json -Depth 6
          $url  = "https://api.github.com/gists/$($env:GIST_ID)"

          $null = curl.exe -s -X PATCH $url `
            -H "Authorization: Bearer $($env:GIST_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            -d $json

          $raw = "https://gist.githubusercontent.com/zoleevegh/$($env:GIST_ID)/raw/summary_report_1.md?run=${{ github.run_id }}"
          "Run report:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
