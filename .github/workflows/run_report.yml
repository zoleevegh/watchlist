name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      master_csv_url:
        description: "MASTER CSV URL (optional; üresen a default MASTER megy)"
        required: false
        default: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare reports folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

      - name: Download MASTER CSV
        shell: bash
        env:
          MASTER_URL: ${{ inputs.master_csv_url }}
        run: |
          set -euo pipefail
          if [ -z "${MASTER_URL}" ]; then
            echo "MASTER_URL empty, using default."
            MASTER_URL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"
          fi

          echo "MASTER_URL=${MASTER_URL}"
          curl -L --fail --silent --show-error "${MASTER_URL}" -o reports/master.csv

          # sanity: show first line count
          echo "MASTER rows:" $(($(wc -l < reports/master.csv) - 1))

      - name: Run PRICE ENGINE (#1)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/report_runner.py --master reports/master.csv --out reports/summary_report_1.md 2> reports/runner.log
          echo "Runner exit code: $?" >> reports/runner.log

      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/master.csv
            reports/runner.log

      - name: Update fixed Gist with #1 report
        if: always()
        shell: bash
        env:
          GIST_ID: 5df443b8a46ef863cdc97aad62756510
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GIST_TOKEN}" ]; then
            echo "No GIST_TOKEN secret — skip Gist update (#1)."
            exit 0
          fi

          if [ ! -f reports/summary_report_1.md ]; then
            echo "summary_report_1.md not found — skip Gist update."
            exit 0
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          content = Path("reports/summary_report_1.md").read_text(encoding="utf-8", errors="replace")
          payload = {"files": {"summary_report_1.md": {"content": content}}}
          Path("reports/gist_payload.json").write_text(json.dumps(payload), encoding="utf-8")
          PY

          curl -sS -X PATCH "https://api.github.com/gists/${GIST_ID}"             -H "Authorization: Bearer ${GIST_TOKEN}"             -H "Accept: application/vnd.github+json"             -H "Content-Type: application/json"             --data-binary @reports/gist_payload.json             > /dev/null

          echo "Gist updated."

      - name: Job summary (single clickable nocache URL)
        if: always()
        shell: bash
        env:
          GIST_ID: 5df443b8a46ef863cdc97aad62756510
        run: |
          set -euo pipefail

          NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}-${RANDOM}"
          BASE="https://gist.githubusercontent.com/zoleevegh/${GIST_ID}/raw/summary_report_1.md"
          URL="${BASE}?nocache=${NONCE}"

          echo "Raw report URL (nocache):" >> "${GITHUB_STEP_SUMMARY}"
          echo "${URL}" >> "${GITHUB_STEP_SUMMARY}"
