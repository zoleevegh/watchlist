name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run PRICE ENGINE (#1)
        id: runner
        shell: bash
        env:
          MASTER_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"
        run: |
          set -euo pipefail
          mkdir -p reports
          echo "MASTER_URL=${MASTER_URL}"

          set +e
          python scripts/report_runner.py --master "${MASTER_URL}" --out "reports/summary_report_1.md" --report 1 2> "reports/runner.log"
          code=$?
          set -e

          echo "Runner exit code: ${code}" >> "reports/runner.log"
          echo "exit_code=${code}" >> "$GITHUB_OUTPUT"

      - name: Build nocache link + summary
        if: steps.runner.outputs.exit_code == '0'
        shell: bash
        env:
          GIST_ID: "5df443b8a46ef863cdc97aad62756510"
        run: |
          set -euo pipefail

          NONCE="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${GITHUB_SHA}-$(date +%s)"
          URL="https://gist.githubusercontent.com/zoleevegh/${GIST_ID}/raw/summary_report_1.md?nocache=${NONCE}"

          echo "${URL}" > reports/raw_url_1.txt

          {
            echo "Job summary generated at run-time (${GITHUB_RUN_ID})"
            echo
            echo "Raw report URL (nocache):"
            echo "${URL}"
            echo
            echo "[Open raw report (nocache)](${URL})"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update Gist (summary_report_1.md)
        if: steps.runner.outputs.exit_code == '0'
        shell: bash
        env:
          GIST_ID: "5df443b8a46ef863cdc97aad62756510"
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ ! -f reports/summary_report_1.md ]; then
            echo "summary_report_1.md not found — runner likely failed. Skip Gist update." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python -c "import json; from pathlib import Path; content = Path('reports/summary_report_1.md').read_text(encoding='utf-8', errors='replace'); payload = {'files': {'summary_report_1.md': {'content': content}}}; Path('reports/gist_payload.json').write_text(json.dumps(payload), encoding='utf-8')"

          curl -sS -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @reports/gist_payload.json \
            > /dev/null

      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/raw_url_1.txt
            reports/runner.log

      - name: Fail job if runner failed
        if: steps.runner.outputs.exit_code != '0'
        shell: bash
        run: |
          echo "Runner failed with exit code: ${{ steps.runner.outputs.exit_code }}"
          exit 1
