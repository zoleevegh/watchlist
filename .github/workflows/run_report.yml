# Version: v4.2.17-price-engine-cleanlink-ubuntu-2026-01-06
# Last updated: 2026-01-06
#
# FIX (stabil):
# - Ubuntu runner (kevesebb PowerShell-idézőjel pokol)
# - Runner hívás: NINCS --report (kompatibilis a régi report_runner.py-val is)
# - Job Summary: 1 db TELJES kattintható URL, automatikus cache-buster: ?nocache=runid-attempt-rand
# - Ugyanez elmentve: reports/raw_url.txt (artifact)
#
# Verzió-szabály: bármely fájl módosításakor a verziószámot folytatólagosan kell növelni, kihagyás nélkül.

name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      master_csv_url:
        description: "MASTER CSV URL (ha üres, a defaultot használja)"
        required: false
        default: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      PYTHONUNBUFFERED: "1"
      GIST_ID: 5df443b8a46ef863cdc97aad62756510

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (if requirements.txt)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f requirements.txt ]; then
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          else
            echo "No requirements.txt, skipping pip install."
          fi

      - name: Fetch MASTER CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

          URL='${{ inputs.master_csv_url }}'
          if [ -z "${URL}" ]; then
            URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv'
          fi

          echo "MASTER CSV URL: ${URL}"
          curl -L --fail "${URL}" -o reports/master.csv
          echo "MASTER CSV lines: $(wc -l < reports/master.csv)"

      - name: Run PRICE ENGINE (#1) — capture runner.log
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

          # NINCS --report (kompatibilitás)
          python -X faulthandler -u scripts/report_runner.py \
            --master reports/master.csv \
            --out reports/summary_report_1.md \
            2>&1 | tee reports/runner.log

      - name: Update fixed Gist with #1 report
        if: always()
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "${GIST_TOKEN:-}" ]; then
            echo "No GIST_TOKEN secret – skip Gist update (#1)."
            exit 0
          fi

          if [ ! -f reports/summary_report_1.md ]; then
            echo "summary_report_1.md not found – runner likely failed. Skip Gist update."
            exit 0
          fi

          python - <<'PY'
import json
from pathlib import Path
content = Path('reports/summary_report_1.md').read_text(encoding='utf-8', errors='replace')
payload = {"files": {"summary_report_1.md": {"content": content}}}
Path('reports/gist_payload.json').write_text(json.dumps(payload), encoding='utf-8')
PY

          curl -sS -X PATCH "https://api.github.com/gists/${GIST_ID}" \
            -H "Authorization: Bearer ${GIST_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @reports/gist_payload.json \
            > /dev/null

          echo "Gist updated."

      - name: Job summary (single clickable nocache URL)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports

          BASE="https://gist.githubusercontent.com/zoleevegh/${GIST_ID}/raw/summary_report_1.md"
          NONCE="$(python - <<'PY'
import secrets
print(secrets.token_hex(6))
PY
)"
          URL="${BASE}?nocache=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${NONCE}"

          echo "Raw report URL (nocache): ${URL}" >> "${GITHUB_STEP_SUMMARY}"
          echo "${URL}" > reports/raw_url.txt

      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/runner.log
            reports/master.csv
            reports/raw_url.txt
            reports/gist_payload.json
