# FIXED run_report.yml – v3.6.5
# Purpose: restore valid workflow_dispatch + keep full pipeline intact

name: Run report (#1/#2/#3)

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Report number (1, 2 or 3)"
        required: true
        default: "1"

jobs:
  run-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # EXISTING PIPELINE (UNCHANGED)
      # =========================

      - name: Analyst feed parser
        run: python scripts/analyst_feed_parser.py --report ${{ inputs.report }}

      - name: Analyst & catalyst builder
        run: python scripts/analyst_catalyst_builder.py --report ${{ inputs.report }}

      # =========================
      # NEW – EARNINGS & YAHOO EVENTS
      # =========================

      - name: Earnings fetcher
        run: python scripts/earnings_fetcher.py --report ${{ inputs.report }}

      - name: Yahoo analyst events fetcher
        run: python scripts/yahoo_analyst_events_fetcher.py --report ${{ inputs.report }}

      # =========================
      # POSTPROCESS
      # =========================

      - name: Postprocess report
        run: python scripts/postprocess_report.py --report ${{ inputs.report }}
