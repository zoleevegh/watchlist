# Version: v4.2.12-price-engine-summary-backtickfix-2026-01-06
# Last updated: 2026-01-06T10:20:00+01:00
#
# FIX:
# - Summary-ba kattintható teljes URL (nocache GUID) + split sorok másoláshoz
# - Old-style Out-File -Append (ahogy a régi snippetben volt), nincs Set-Content trükközés
# - A teljes URL fájlba is mentve: reports/raw_url.txt (artifact)
#
# Verzió-szabály: bármely fájl módosításakor a verziószámot folytatólagosan kell növelni, kihagyás nélkül.

name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      PRICE_ENGINE_REPORT:
        description: "PRICE ENGINE csak #1 (AH+PM)."
        required: true
        default: "1"

jobs:
  run:
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"

      # Gist (fix)
      GIST_ID: 5df443b8a46ef863cdc97aad62756510

      # MASTER watchlist CSV (alapértelmezett)
      MASTER_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (if requirements.txt)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          if (Test-Path "requirements.txt") {
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          } else {
            Write-Host "No requirements.txt, skipping pip install."
          }

      - name: Fetch MASTER CSV
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          $url = "${env:MASTER_CSV_URL}"
          if ([string]::IsNullOrWhiteSpace($url)) {
            throw "MASTER_CSV_URL is empty – cannot fetch master.csv"
          }

          Write-Host "MASTER CSV URL: $url"
          curl.exe -L --fail "$url" -o "reports\master.csv"
          Write-Host "MASTER CSV lines:" (Get-Content "reports\master.csv" | Measure-Object -Line).Lines

      - name: Run PRICE ENGINE (#1) — capture runner.log
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          cmd.exe /c "python -X faulthandler -u scripts\report_runner.py --report 1 --master reports\master.csv --out reports\summary_report_1.md > reports\runner.log 2>&1"
          $code = [int]$LASTEXITCODE

          Write-Host "Runner exit code: $code"
          Write-Host "---- runner.log (last 200 lines) ----"
          if (Test-Path "reports\runner.log") { Get-Content -Path "reports\runner.log" -Tail 200 } else { Write-Host "runner.log missing" }
          Write-Host "-------------------------------------"

          if ($code -ne 0) { throw "Runner failed with exit code $code" }

      # --- Gist update (old-style curl.exe -X PATCH) ---
      - name: Update fixed Gist with #1 report
        if: always()
        shell: pwsh
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8

          if (-not $env:GIST_TOKEN) {
            Write-Host "No GIST_TOKEN secret – skip Gist update (#1)."
            exit 0
          }

          $path = "reports\summary_report_1.md"
          if (-not (Test-Path $path)) {
            Write-Host "summary_report_1.md not found – likely runner failed. Skip Gist update."
            exit 0
          }

          $content = Get-Content -Raw $path
          $body = @{
            files = @{
              "summary_report_1.md" = @{
                content = $content
              }
            }
          }

          $json = $body | ConvertTo-Json -Depth 6 -Compress
          $url  = "https://api.github.com/gists/$($env:GIST_ID)"

          curl.exe -s -X PATCH $url `
            -H "Authorization: Bearer $($env:GIST_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            -d $json | Out-Null

          Write-Host "Gist updated."

      # --- Job summary: full, clickable URL + split copy lines ---
      - name: Job summary (one clickable nocache URL + split copy lines)
        if: always()
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          $gistId = "${env:GIST_ID}"
          $rawStable = "https://gist.githubusercontent.com/zoleevegh/$gistId/raw/summary_report_1.md"

          # krix-krax: GUID + run_id (dupla biztosíték)
          $krix = [guid]::NewGuid().ToString("N")
          $runId = $env:GITHUB_RUN_ID
          if ([string]::IsNullOrWhiteSpace($runId)) { $runId = "0" }

          $raw = "$rawStable?nocache=$krix-$runId"

          # file (artifact)
          $raw | Out-File -FilePath "reports\raw_url.txt" -Encoding utf8

          $ts = Get-Date -Format 'yyyy-MM-ddTHH:mmzzz'

          "Job summary generated at run-time ($ts)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          # kattintható, teljes URL (ez a lényeg)
          "[Open raw report (nocache)]($raw)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          "**Copy raw URL (split):**" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          $rawStable | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "?nocache=$krix-$runId" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          '**Copy raw URL (artifact):** download `report-bundle` → `reports/raw_url.txt`' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/runner.log
            reports/master.csv
            reports/raw_url.txt
