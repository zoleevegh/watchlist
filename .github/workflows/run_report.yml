name: Run Report (Windows)

on:
  workflow_dispatch:
    inputs:
      report:
        description: 'Jelentés: 1=AH+PM, 2=Open→Close (előző nap), 3=Ma Open→Most'
        default: '3'
        required: false
      csv_url:
        description: 'MASTER CSV URL (üres = DEFAULT_CSV_URL)'
        default: ''
        required: false
      override_pct:
        description: 'Napi extrém blokk küszöb (PrevClose→Most). 0 = kikapcsolva (#3)'
        default: '8'
        required: false
      macro:
        description: 'Politika/FED blokk: auto | off | strict'
        default: 'auto'
        required: false
  repository_dispatch:
    types: [run_report]

jobs:
  run:
    runs-on: windows-latest

    env:
      # ← IDE írd a Google Sheets "Publish to web" CSV linkjét
      DEFAULT_CSV_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vTf5h3xx4LWJvI-e7PSyc8g6uGZT-H6pCeuwEqs7NqeCDKuAltTpL_ncPOWMtooRw/pub?output=csv

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests yfinance pytz feedparser beautifulsoup4 googletrans==4.0.0rc1

      - name: Resolve inputs (report, csv, override, macro)
        id: vars
        shell: pwsh
        run: |
          $report = "${{ github.event.inputs.report }}"
          if (-not $report) { $report = "${{ github.event.client_payload.report }}" }
          if (-not $report) { $report = "3" }

          $csv = "${{ github.event.inputs.csv_url }}"
          if (-not $csv) { $csv = "${{ github.event.client_payload.csv_url }}" }
          if (-not $csv) { $csv = "${{ env.DEFAULT_CSV_URL }}" }

          $ovr = "${{ github.event.inputs.override_pct }}"
          if (-not $ovr) { $ovr = "8" }

          $macro = "${{ github.event.inputs.macro }}"
          if (-not $macro) { $macro = "auto" }

          "report=$report" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "csv=$csv"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "ovr=$ovr"       | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "macro=$macro"   | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          Write-Host "REPORT: $report"
          Write-Host "CSV URL: $csv"
          Write-Host "OVERRIDE_PCT: $ovr"
          Write-Host "MACRO: $macro"

      - name: Fetch MASTER CSV (robust)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $out   = "reports\master.csv"
          $csvUrl = "${{ steps.vars.outputs.csv }}"
          Write-Host "Letöltés: $csvUrl"
          & curl.exe -fL --retry 3 --retry-all-errors -A "Mozilla/5.0" "$csvUrl" -o "$out"
          if ($LASTEXITCODE -ne 0) { Write-Error "CSV letöltés sikertelen (curl exit $LASTEXITCODE)"; exit 1 }
          if ((Get-Item "$out").Length -lt 10) { Write-Error "A CSV túl kicsi / üres"; exit 1 }
          $first = Get-Content "$out" -TotalCount 1
          if ($first -match "<!DOCTYPE html>|<html") { Write-Error "Nem CSV érkezett (HTML). Ellenőrizd a Publish to web linket"; exit 1 }
          Get-Content "$out" -TotalCount 5 | ForEach-Object { Write-Host "CSV> $_" }

      - name: Run report (#1/#2/#3)
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [System.Text.Encoding]::UTF8
          $env:PYTHONIOENCODING = "utf-8"
          $report = "${{ steps.vars.outputs.report }}"
          $csv    = "reports\master.csv"
          $ovr    = "${{ steps.vars.outputs.ovr }}"
          $macro  = "${{ steps.vars.outputs.macro }}"
          if (-not (Test-Path "scripts\report_runner.py")) {
            Write-Error "scripts\report_runner.py hiányzik a repóban"; exit 1
          }
          python -X utf8 "scripts\report_runner.py" --report $report --csv "$csv" --summary "$env:GITHUB_STEP_SUMMARY" --override-pct $ovr --macro $macro

      # Egyszeri unlisted Gist létrehozása (nem kötelező, de meghagytam)
      - name: Publish summary to Gist (unlisted)
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
        run: |
          if (-not $env:GH_GIST_TOKEN) { Write-Host "No GH_GIST_TOKEN – skip"; exit 0 }

          $files = Get-ChildItem reports -Filter "summary_report*.md" | Select-Object -ExpandProperty FullName
          if (-not $files) { Write-Host "No summary file found"; exit 0 }

          $payload = @{
            description = "Részvények – automata riport (unlisted)"
            public      = $false
            files       = @{}
          }
          foreach ($f in $files) {
            $name = Split-Path $f -Leaf
            $content = Get-Content -Raw $f
            $payload.files[$name] = @{ content = $content }
          }

          $json    = $payload | ConvertTo-Json -Depth 10
          $headers = @{
            Authorization = "token $env:GH_GIST_TOKEN"
            "Content-Type" = "application/json"
          }

          $resp = Invoke-RestMethod -Method Post -Uri "https://api.github.com/gists" -Headers $headers -Body $json
          if (-not $resp.html_url) {
            Write-Error ("Gist create failed: " + ($resp | ConvertTo-Json -Depth 10))
            exit 1
          }

          "Gist URL: $($resp.html_url)"

      - name: Upload artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: reports/**
          if-no-files-found: warn

      # Fix Gist frissítése: mindig ugyanaz az URL frissül (HC_GIST_ID secret alapján)
      - name: Update fixed Gist with latest summary
        if: ${{ always() }}
        shell: pwsh
        env:
          GH_GIST_TOKEN: ${{ secrets.GH_GIST_TOKEN }}
          HC_GIST_ID: ${{ secrets.HC_GIST_ID }}
        run: |
          if (-not $env:GH_GIST_TOKEN) { Write-Host "No GH_GIST_TOKEN – skip"; exit 0 }
          if (-not $env:HC_GIST_ID) { Write-Host "No HC_GIST_ID – skip"; exit 0 }

          $files = Get-ChildItem reports -Filter "summary_report*.md"
          if (-not $files) { Write-Host "No summary files to publish"; exit 0 }

          $payload = @{ files = @{} }
          foreach ($f in $files) {
            $name = Split-Path $f -Leaf
            $content = Get-Content -Raw $f
            $payload.files[$name] = @{ content = $content }
          }

          $json    = $payload | ConvertTo-Json -Depth 10
          $headers = @{
            Authorization = "token $env:GH_GIST_TOKEN"
            "Content-Type" = "application/json"
          }

          $uri  = "https://api.github.com/gists/$($env:HC_GIST_ID)"
          $resp = Invoke-RestMethod -Method Patch -Uri $uri -Headers $headers -Body $json

          if (-not $resp.html_url) {
            Write-Error ("Gist update failed: " + ($resp | ConvertTo-Json -Depth 10))
            exit 1
          }

          "Gist updated: $($resp.html_url)"
