# Version: v4.1.9-price-engine-cachebuster-guid-2026-01-06
# Last updated: 2026-01-06T00:15:00+01:00
#
# FIXEK (v4.1.9):
# - Summary-ban automatikus random cache-buster a gist raw link végén (?cb=<guid>).
# - ALL_NA (exit 5) esetén NEM frissítjük a gist-et.
# - Gist frissítés GitHub API-val (Invoke-RestMethod) — nincs külső action dependency.
#
# Verzió-szabály: bármely fájl módosításakor a verziószámot folytatólagosan kell növelni, kihagyás nélkül.

name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      PRICE_ENGINE_REPORT:
        description: "PRICE ENGINE csak #1 (AH+PM)."
        required: true
        default: "1"

jobs:
  run:
    runs-on: windows-latest
    env:
      PYTHONUNBUFFERED: "1"
      GIST_ID_1: 5df443b8a46ef863cdc97aad62756510
      DEFAULT_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vS0vpBd1ADF3_Godyflgh3-TbJoj_CCRBJ4QHeLiZCY12tHPWuTIL5OZBTByMApdT92vjS2pRpI1koM/pub?output=csv"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps (if requirements.txt)
        shell: pwsh
        run: |
          if (Test-Path "requirements.txt") {
            python -m pip install --upgrade pip
            pip install -r requirements.txt
          } else {
            Write-Host "No requirements.txt, skipping pip install."
          }

      - name: Fetch MASTER CSV
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          $url = "${env:MASTER_CSV_URL}"
          if ([string]::IsNullOrWhiteSpace($url)) { $url = "${env:DEFAULT_CSV_URL}" }
          Write-Host "MASTER CSV URL: $url"
          curl.exe -L --fail "$url" -o "reports\master.csv"
          Write-Host "MASTER CSV lines:" (Get-Content "reports\master.csv" | Measure-Object -Line).Lines

      - name: Run PRICE ENGINE (#1) — capture runner.log (ALL_NA skip gist)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null
          cmd.exe /c "python -X faulthandler -u scripts\report_runner.py --report 1 --master reports\master.csv --out reports\summary_report_1.md > reports\runner.log 2>&1"
          $code = [int]$LASTEXITCODE

          Write-Host "Runner exit code: $code"
          Write-Host "---- runner.log (last 200 lines) ----"
          if (Test-Path "reports\runner.log") { Get-Content -Path "reports\runner.log" -Tail 200 } else { Write-Host "runner.log missing" }
          Write-Host "-------------------------------------"

          if ($code -eq 0) {
            "SHOULD_UPDATE_GIST=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } elseif ($code -eq 5) {
            "SHOULD_UPDATE_GIST=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Warning "ALL_NA (exit 5): Gist update kihagyva."
            exit 0
          } else {
            "SHOULD_UPDATE_GIST=0" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            exit $code
          }

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/runner.log
            reports/master.csv

      - name: Update Gist (#1) — SKIP on ALL_NA
        if: env.SHOULD_UPDATE_GIST == '1'
        shell: pwsh
        env:
          GH_GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if (-not (Test-Path "reports\summary_report_1.md")) {
            throw "Missing reports\summary_report_1.md – cannot update gist."
          }

          $content = Get-Content -Path "reports\summary_report_1.md" -Raw
          $body = @{
            files = @{
              "summary_report_1.md" = @{
                content = $content
              }
            }
          } | ConvertTo-Json -Depth 6

          $headers = @{
            "Authorization" = "token $env:GH_GIST_TOKEN"
            "User-Agent"    = "watchlist-price-engine"
            "Accept"        = "application/vnd.github+json"
          }

          $url = "https://api.github.com/gists/${env:GIST_ID_1}"
          Invoke-RestMethod -Method PATCH -Uri $url -Headers $headers -Body $body | Out-Null
          Write-Host "Gist updated."

      - name: Run summary (stable + cache-buster)
        if: always()
        shell: pwsh
        run: |
          $rawStable = "https://gist.githubusercontent.com/zoleevegh/${env:GIST_ID_1}/raw/summary_report_1.md"
          $cb = [guid]::NewGuid().ToString("N")
          $rawFresh  = "$rawStable?cb=$cb"

          "### Job summary generated at run-time ($(Get-Date -Format 'yyyy-MM-ddTHH:mmzzz'))" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "**Raw URL (stable):** $rawStable" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "**Raw URL (fresh):**  $rawFresh"  | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "**SHOULD_UPDATE_GIST:** $env:SHOULD_UPDATE_GIST" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
