# Version: v4.0.0-price-engine-2026-01-05
# Last updated: 2026-01-05T09:00:00+01:00
# Cél: PRICE ENGINE workflow — csak AH/PM % + küszöb + lefedettség. NINCS makró / analyst / catalyst / high-conv.

name: Run Report (Windows) — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      report:
        description: "Csak #1 támogatott (AH+PM). Más értéket figyelmen kívül hagyunk."
        default: "1"
        required: false
  repository_dispatch:
    types: [run_report]

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"

      # MASTER (Google Sheets 'Publish to web' CSV) — ez legyen a teljes sheet, hogy minden ticker lefedett legyen
      DEFAULT_CSV_URL: https://docs.google.com/spreadsheets/d/e/.../pub?output=csv

      # Gist (#1) — summary_report_1.md
      GIST_ID_1: 5df443b8a46ef863cdc97aad62756510

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve inputs (force report=1)
        id: vars
        shell: pwsh
        run: |
          # A price-engine csak #1-et támogat
          $report = "1"
          "report=$report" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "REPORT (forced): $report"

      - name: Fetch MASTER CSV
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path reports | Out-Null

          $url = "${{ env.DEFAULT_CSV_URL }}"
          if (-not $url) {
            Write-Error "DEFAULT_CSV_URL nincs beállítva."
            exit 1
          }

          $out = "reports\master.csv"
          Write-Host "MASTER CSV letöltés: $url"
          & curl.exe -fL --retry 3 --retry-all-errors -A "Mozilla/5.0" "$url" -o "$out"
          if ($LASTEXITCODE -ne 0) {
            Write-Error "MASTER CSV letöltés sikertelen (curl exit $LASTEXITCODE)."
            exit 1
          }

          $first = Get-Content "$out" -TotalCount 1
          if ($first -match "<!DOCTYPE html>|<html") {
            Write-Error "Nem CSV érkezett (HTML). Ellenőrizd a Publish to web linket."
            exit 1
          }

          Get-Content "$out" -TotalCount 5 | ForEach-Object { Write-Host "CSV> $_" }

      - name: Run PRICE ENGINE (#1)
        shell: pwsh
        run: |
          python scripts\report_runner.py --report 1 --master reports\master.csv --out reports\summary_report_1.md

      - name: Validate report output
        shell: pwsh
        run: |
          python scripts\validate_run.py --report 1 --path reports\summary_report_1.md

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: |
            reports/summary_report_1.md
            reports/master.csv

      - name: Update Gist (#1)
        shell: pwsh
        env:
          GIST_ID: ${{ env.GIST_ID_1 }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          if (-not $env:GIST_TOKEN) {
            Write-Host "No GIST_TOKEN secret – skip Gist update."
            exit 0
          }

          $reportPath = "reports\summary_report_1.md"
          if (-not (Test-Path $reportPath)) {
            Write-Error "Hiányzik a report: $reportPath"
            exit 1
          }

          $content = Get-Content $reportPath -Raw -Encoding utf8

          $body = @{
            files = @{
              "summary_report_1.md" = @{
                content = $content
              }
            }
          }

          $json = $body | ConvertTo-Json -Depth 6
          $url  = "https://api.github.com/gists/$($env:GIST_ID)"

          $resp = curl.exe -s -X PATCH $url `
            -H "Authorization: Bearer $($env:GIST_TOKEN)" `
            -H "Accept: application/vnd.github+json" `
            -H "Content-Type: application/json" `
            -d $json

          "Raw URL for this run:" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          "https://gist.githubusercontent.com/zoleevegh/$($env:GIST_ID)/raw/summary_report_1.md?run=${{ github.run_id }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
