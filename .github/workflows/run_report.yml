name: Run Report — PRICE ENGINE

on:
  workflow_dispatch:
    inputs:
      master_csv_url:
        description: "MASTER CSV URL (optional). Leave empty to use default."
        required: false
        default: ""

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run PRICE ENGINE (#1) + build stable nocache link
        shell: bash
        env:
          # Default MASTER CSV (latest)
          DEFAULT_MASTER_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv"
        run: |
          set -euo pipefail
          mkdir -p reports

          # Resolve MASTER URL (input overrides default)
          MASTER_URL="${{ github.event.inputs.master_csv_url }}"
          if [ -z "${MASTER_URL}" ]; then
            MASTER_URL="${DEFAULT_MASTER_CSV_URL}"
          fi
          echo "MASTER_URL=${MASTER_URL}" | tee reports/runner.log

          # Download MASTER to a local file (safer + artifact-friendly)
          if ! curl -fsSL "${MASTER_URL}" -o reports/master.csv ; then
            echo "WARN: MASTER download failed - runner will try reading URL directly." | tee -a reports/runner.log
          else
            echo "MASTER downloaded: reports/master.csv" | tee -a reports/runner.log
          fi

          # Pick runner path
          if [ -f "report_runner.py" ]; then
            RUNNER="report_runner.py"
          elif [ -f "scripts/report_runner.py" ]; then
            RUNNER="scripts/report_runner.py"
          else
            echo "Runner script not found (report_runner.py / scripts/report_runner.py)." | tee -a reports/runner.log
            exit 1
          fi

          # Run runner (never hard-fail the job; we still want the stable raw link + gist update)
          RC=0
          set +e
          if [ -f "reports/master.csv" ]; then
            python "${RUNNER}" --master "reports/master.csv" --out "reports/summary_report_1.md"
            RC=$?
          else
            python "${RUNNER}" --master "${MASTER_URL}" --out "reports/summary_report_1.md"
            RC=$?
          fi
          set -e

          if [ "${RC}" -ne 0 ] || [ ! -f "reports/summary_report_1.md" ]; then
            python - <<'PY'
            from pathlib import Path
            Path('reports').mkdir(parents=True, exist_ok=True)
            Path('reports/summary_report_1.md').write_text(
                "# #1 – Premarket check (PRICE ENGINE)\n\n"
                "NO_DATA: a report nem készült el (runner crash / hiányzó fájl / forráshiba).\n",
                encoding='utf-8'
            )
            PY
            echo "RUNNER_EXIT=${RC}" | tee -a reports/runner.log
          fi

          # Build one single clickable nocache URL (run id + attempt + sha)
          NOCACHE="${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}"
          RAW_URL="https://gist.githubusercontent.com/zoleevegh/5df443b8a46ef863cdc97aad62756510/raw/summary_report_1.md?nocache=${NOCACHE}"

          # Save raw url to artifact-friendly file too
          echo "${RAW_URL}" > reports/raw_url_1.txt

          # Job summary (single link + copyable)
          {
            echo "Job summary generated at run-time (${{ github.run_id }})"
            echo ""
            echo "Raw URL for this run:"
            echo "${RAW_URL}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate report (soft)
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "validate_run.py" ]; then
            python validate_run.py --report 1 --path "reports/summary_report_1.md" || true
          elif [ -f "scripts/validate_run.py" ]; then
            python scripts/validate_run.py --report 1 --path "reports/summary_report_1.md" || true
          else
            echo "No validate_run.py found - skip."
          fi

      - name: Update Gist (summary_report_1.md)
        if: always()
        shell: bash
        env:
          GIST_ID: "5df443b8a46ef863cdc97aad62756510"
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GIST_TOKEN:-}" ]; then
            echo "No GIST_TOKEN secret - skip Gist update."
            exit 0
          fi
          if [ ! -f "reports/summary_report_1.md" ]; then
            echo "reports/summary_report_1.md not found - skip Gist update."
            exit 0
          fi

          python - << 'PY'
import json
from pathlib import Path

gist_id = "5df443b8a46ef863cdc97aad62756510"
content = Path("reports/summary_report_1.md").read_text(encoding="utf-8", errors="replace")
payload = {"files": {"summary_report_1.md": {"content": content}}}
Path("reports/gist_payload.json").write_text(json.dumps(payload), encoding="utf-8")
PY

          curl -sS -X PATCH "https://api.github.com/gists/${GIST_ID}"             -H "Authorization: token ${GIST_TOKEN}"             -H "Accept: application/vnd.github+json"             --data-binary "@reports/gist_payload.json" > /dev/null

          echo "Gist updated."

      - name: Upload artifacts (bundle)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-bundle
          path: reports/
