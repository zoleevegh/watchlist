# TEMP: earnings-only mode – DO NOT run AH/PM runner yet. Revert later.
name: PRICE ENGINE – earnings-only (TEMP)

on:
  workflow_dispatch:

jobs:
  earnings_only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Prepare reports dir
        run: |
          mkdir -p reports

      - name: Download MASTER CSV
        run: |
          curl -fsSL "${MASTER_URL}" -o reports/master.csv
        env:
          MASTER_URL: https://docs.google.com/spreadsheets/d/e/2PACX-1vQkgyw0ONwSfc2KnrmWGqf8fWVQxS-R08RySndB69KDJ8L1Cz-H2F1AZtyDfhBGedC0qdC1SFo_aDye/pub?output=csv

      - name: Run earnings audit only
        run: |
          python "scripts/earnings.py"

      - name: Upload artifact (earnings_audit.json)
        uses: actions/upload-artifact@v4
        with:
          name: earnings_audit
          path: reports/earnings_audit.json
