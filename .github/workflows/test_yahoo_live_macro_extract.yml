name: Yahoo Live Macro Extract v1.0.1
"on":
  workflow_dispatch:
    inputs:
      yahoo_live_url:
        description: "Yahoo Live URL to probe+extract"
        required: false
        default: "https://finance.yahoo.com/news/live/stock-market-today-dow-sp-500-nasdaq-falter-with-big-week-of-big-tech-earnings-fed-meeting-ahead-110341565.html"
      max_attempts:
        description: "Max attempts (includes first try)"
        required: false
        default: "4"
      timeout_secs:
        description: "HTTP timeout seconds"
        required: false
        default: "25"

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Sanity check
        run: |
          test -f scripts/yahoo_live_macro_extract.py
          python -m py_compile scripts/yahoo_live_macro_extract.py

      - name: Run extract
        env:
          YAHOO_LIVE_URL: ${{ inputs.yahoo_live_url }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          TIMEOUT_SECS: ${{ inputs.timeout_secs }}
        run: |
          python scripts/yahoo_live_macro_extract.py
          test -f macro_yahoo_live.md
          echo "---- macro_yahoo_live.md ----"
          cat macro_yahoo_live.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yahoo-live-macro
          path: macro_yahoo_live.md

