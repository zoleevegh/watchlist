name: Update biblia docs

on:
  push:
    paths:
      - "scripts/biblia_helper.py"
      - "scripts/export_biblia_md.py"
      - ".github/workflows/update_biblia_docs.yml"

jobs:
  update-biblia-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Export biblia_leiras.md
        run: |
          python -m pip install --upgrade pip
          python scripts/export_biblia_md.py

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet docs/biblia_leiras.md; then
            git add docs/biblia_leiras.md
            git commit -m "Update biblia_leiras.md from export_biblia_md"
          else
            echo "Nincs változás a biblia_leiras.md-ben."
      - name: Push changes
        if: success()
        run: |
          git push
